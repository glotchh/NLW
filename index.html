<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Listworthy Extreme Demons</title>
    <link rel="icon" type="image/png" href="nlw.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Papa Parse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        spacebg: '#030712',
                        spacecard: '#0b0f19',
                        spaceborder: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-spacebg text-slate-100 min-h-screen font-sans selection:bg-indigo-500 selection:text-white bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(120,119,198,0.15),rgba(255,255,255,0))]">

    <div class="max-w-7xl mx-auto px-4 py-12">
        <!-- Header -->
        <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-spaceborder pb-6 gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white flex items-center gap-3">
                    Non-Listworthy Extreme Demons
                </h1>
                <p class="text-slate-400 mt-2 text-sm md:text-base">
                    <a href="https://docs.google.com/spreadsheets/d/1YxUE2kkvhT2E6AjnkvTf-o8iu_shSLbuFkEFcZOvieA/" target="_blank" class="text-indigo-400 hover:underline font-semibold">Original Sheet</a>
                </p>
            </div>
            <div id="counter-badge" class="bg-indigo-950/60 border border-indigo-500/30 text-indigo-300 font-semibold px-4 py-2 rounded-xl text-sm shadow-lg shadow-indigo-950/50">
                Loading data...
            </div>
        </header>

        <!-- Filters Section -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-10 bg-spacecard/60 backdrop-blur-md border border-spaceborder p-5 rounded-2xl shadow-xl">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Filter by Tier</label>
                <select id="tier-filter" 
                    class="w-full bg-slate-900 border border-spaceborder rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-indigo-500 transition shadow-inner">
                    <option value="all">All Tiers</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Filter by Skillset</label>
                <select id="skillset-filter" 
                    class="w-full bg-slate-900 border border-spaceborder rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-indigo-500 transition shadow-inner">
                    <option value="all">All Skillsets</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Filter by Length</label>
                <select id="length-filter" 
                    class="w-full bg-slate-900 border border-spaceborder rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-indigo-500 transition shadow-inner">
                    <option value="all">All Lengths</option>
                    <option value="medium">Medium (&lt; 0:59)</option>
                    <option value="long">Long (1:00 - 1:59)</option>
                    <option value="xl">XL (&gt;= 2:00)</option>
                </select>
            </div>
        </div>

        <!-- Loading View -->
        <div id="loading-view" class="text-center py-28">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-500 border-t-transparent mb-4"></div>
            <p class="text-slate-400 font-medium">Reading sheet structure...</p>
        </div>

        <!-- Empty State View -->
        <div id="empty-view" class="hidden text-center py-20 bg-spacecard/40 border border-spaceborder rounded-2xl">
            <p class="text-slate-400 text-lg">No levels found matching your criteria.</p>
        </div>

        <!-- Main Display Container -->
        <div id="levels-container" class="space-y-4"></div>
    </div>

    <!-- Slide-over Modal for Extra Info -->
    <div id="info-modal" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div id="modal-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity opacity-0"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div id="modal-panel" class="w-screen max-w-md bg-spacecard border-l border-spaceborder p-6 shadow-2xl transform transition-transform duration-300 ease-in-out translate-x-full flex flex-col justify-between overflow-y-auto">
                <div>
                    <div class="flex items-center justify-between border-b border-spaceborder pb-4 mb-6">
                        <h3 id="modal-title" class="text-xl font-bold text-white tracking-wide">Level Details</h3>
                        <button id="close-modal" class="text-slate-400 hover:text-white p-1 rounded-lg bg-slate-900 border border-spaceborder">
                            ✕
                        </button>
                    </div>
                    <div id="modal-content" class="space-y-6 text-sm text-slate-300"></div>
                </div>
                <div class="border-t border-spaceborder pt-4 text-xs text-slate-500 text-center mt-6">
                    Non-Listworthy Extreme Demons Database
                </div>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTkS3uixPNrHp_nnr8dh2XENMuXvPF30vnVykoDDEySHWmdDpK7KZ8EPqZf-uaVA1oc1UgJr0hMKyDu/pub?output=csv';

        const VALID_TIERS = [
            'Beginner', 'Easy', 'Medium', 'Hard', 'Very Hard', 'Insane', 
            'Extreme', 'Remorseless', 'Relentless', 'Terrifying', 
            'Catastrophic', 'Inexorable', 'Excruciating', 'Merciless'
        ];

        const VALID_SKILLSETS = [
            'Ship', 'Learny', 'Memory', 'Timings', 'Wave', 'Duals', 
            'High-CPS', 'Nerve-control', 'All-around', 'Unbalanced', 'Chokepoints'
        ];

        let structuredSections = []; 
        let sheetHeaders = [];
        let rawCsvRows = [];

        Papa.parse(CSV_URL, {
            download: true,
            header: false,
            skipEmptyLines: false,
            complete: function(results) {
                rawCsvRows = results.data;
                parseSheetLayout(results.data);
                initApp();
            },
            error: function(err) {
                console.error('CSV Parsing Error:', err);
                document.getElementById('loading-view').innerHTML = `
                    <p class="text-red-400 font-semibold">Failed to fetch or parse Google Sheets CSV. Please verify publish settings.</p>
                `;
            }
        });

        function parseSheetLayout(rows) {
            structuredSections = [];
            let currentTier = null;
            let currentLevels = [];

            rows.forEach((row, rowIndex) => {
                let rowStringArray = row.map(cell => String(cell || '').trim());
                let joinedRowText = rowStringArray.join(' ').toLowerCase();

                if (rowIndex === 0 || (joinedRowText.includes('level') && joinedRowText.includes('creator'))) {
                    sheetHeaders = rowStringArray;
                }

                if (joinedRowText.includes('shortcuts') || joinedRowText.includes('more levels') || joinedRowText.includes('fuck')) {
                    return;
                }

                let matchedTier = null;
                for (let cell of rowStringArray) {
                    let found = VALID_TIERS.find(t => t.toLowerCase() === cell.toLowerCase());
                    if (found) {
                        matchedTier = found;
                        break;
                    }
                }

                if (matchedTier) {
                    if (currentTier && currentLevels.length > 0) {
                        structuredSections.push({ tier: currentTier, levels: currentLevels });
                    }
                    currentTier = matchedTier;
                    currentLevels = [];
                } else if (currentTier) {
                    let relevantCells = rowStringArray.slice(1);
                    let nonEmpties = relevantCells.filter(c => c.length > 0);

                    if (nonEmpties.length >= 2) {
                        let levelObj = {
                            tier: currentTier,
                            name: rowStringArray[1] || nonEmpties[0] || 'Unknown Level',
                            creator: rowStringArray[2] || nonEmpties[1] || 'Unknown',
                            length: rowStringArray[3] || nonEmpties[2] || 'N/A',
                            skillset: rowStringArray[4] || nonEmpties[3] || 'N/A',
                            enjoyment: rowStringArray[5] || 'N/A',
                            levelId: rowStringArray[6] || '',   // Column G data stays here
                            levelInfo: rowStringArray[7] || '', // Column H data stays here
                            fullRowData: rowStringArray
                        };
                        currentLevels.push(levelObj);
                    }
                }
            });

            if (currentTier && currentLevels.length > 0) {
                structuredSections.push({ tier: currentTier, levels: currentLevels });
            }
        }

        function initApp() {
            document.getElementById('loading-view').classList.add('hidden');
            populateDropdowns();
            renderSections(structuredSections);

            document.getElementById('tier-filter').addEventListener('change', applyFilters);
            document.getElementById('skillset-filter').addEventListener('change', applyFilters);
            document.getElementById('length-filter').addEventListener('change', applyFilters);

            document.getElementById('close-modal').addEventListener('click', closeModal);
            document.getElementById('modal-backdrop').addEventListener('click', closeModal);
        }

        function populateDropdowns() {
            const tierSelect = document.getElementById('tier-filter');
            const skillsetSelect = document.getElementById('skillset-filter');

            VALID_TIERS.forEach(t => {
                let opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                tierSelect.appendChild(opt);
            });

            VALID_SKILLSETS.forEach(s => {
                let opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                skillsetSelect.appendChild(opt);
            });
        }

        function parseLengthToSeconds(lengthStr) {
            if (!lengthStr) return 0;
            let parts = lengthStr.trim().split(':');
            if (parts.length === 2) {
                let mins = parseInt(parts[0], 10) || 0;
                let secs = parseInt(parts[1], 10) || 0;
                return mins * 60 + secs;
            }
            let singleVal = parseFloat(lengthStr);
            return isNaN(singleVal) ? 0 : singleVal;
        }

        function applyFilters() {
            const tierVal = document.getElementById('tier-filter').value;
            const skillsetVal = document.getElementById('skillset-filter').value;
            const lengthVal = document.getElementById('length-filter').value;

            let filteredSections = [];
            let totalMatchedCount = 0;

            structuredSections.forEach(section => {
                if (tierVal !== 'all' && section.tier.toLowerCase() !== tierVal.toLowerCase()) {
                    return;
                }

                let matchedLevels = section.levels.filter(lvl => {
                    let matchesSkillset = (skillsetVal === 'all') || lvl.skillset.toLowerCase().includes(skillsetVal.toLowerCase());
                    
                    let matchesLength = true;
                    if (lengthVal !== 'all') {
                        let totalSecs = parseLengthToSeconds(lvl.length);
                        if (lengthVal === 'medium') {
                            matchesLength = totalSecs < 59;
                        } else if (lengthVal === 'long') {
                            matchesLength = totalSecs >= 60 && totalSecs <= 119;
                        } else if (lengthVal === 'xl') {
                            matchesLength = totalSecs >= 120;
                        }
                    }

                    return matchesSkillset && matchesLength;
                });

                if (matchedLevels.length > 0) {
                    filteredSections.push({
                        tier: section.tier,
                        levels: matchedLevels
                    });
                    totalMatchedCount += matchedLevels.length;
                }
            });

            renderSections(filteredSections, totalMatchedCount);
        }

        function getTierColor(tierName) {
            if (!tierName) return 'border-indigo-500/40 bg-spacecard';
            let t = tierName.toLowerCase();
            if (t.includes('beginner')) return 'border-blue-500/50 bg-blue-950/10 hover:border-blue-400';
            if (t.includes('easy')) return 'border-cyan-500/50 bg-cyan-950/10 hover:border-cyan-400';
            if (t.includes('medium')) return 'border-green-500/50 bg-green-950/10 hover:border-green-400';
            if (t.includes('hard')) return 'border-yellow-500/50 bg-yellow-950/10 hover:border-yellow-400';
            if (t.includes('very hard')) return 'border-orange-500/50 bg-orange-950/10 hover:border-orange-400';
            if (t.includes('insane')) return 'border-red-500/50 bg-red-950/10 hover:border-red-400';
            if (t.includes('extreme')) return 'border-fuchsia-500/50 bg-fuchsia-950/10 hover:border-fuchsia-400';
            if (t.includes('remorseless')) return 'border-purple-500/50 bg-purple-950/10 hover:border-purple-400';
            if (t.includes('relentless')) return 'border-pink-500/50 bg-pink-950/10 hover:border-pink-400';
            if (t.includes('terrifying')) return 'border-rose-500/50 bg-rose-950/10 hover:border-rose-400';
            if (t.includes('catastrophic')) return 'border-amber-600/50 bg-amber-950/10 hover:border-amber-500';
            if (t.includes('inexorable')) return 'border-indigo-500/50 bg-indigo-950/10 hover:border-indigo-400';
            if (t.includes('excruciating')) return 'border-violet-500/50 bg-violet-950/10 hover:border-violet-400';
            if (t.includes('merciless')) return 'border-red-700/50 bg-red-950/20 hover:border-red-500';
            return 'border-spaceborder bg-spacecard';
        }

        function openModal(lvl) {
            document.getElementById('modal-title').textContent = lvl.name;
            const contentContainer = document.getElementById('modal-content');
            contentContainer.innerHTML = '';

            // 1. Swapped names ("Level Info" shows Column G data, "Level ID" shows Column H data)
            // 2. Showcase completely removed from fields array
            const fields = [
                { label: 'Creator(s)', value: lvl.creator },
                { label: 'Length', value: lvl.length },
                { label: 'Skillsets', value: lvl.skillset },
                { label: 'Enjoyment', value: lvl.enjoyment },
                { label: 'Level Info', value: lvl.levelId || 'N/A' },
                { label: 'Level ID', value: lvl.levelInfo || 'None' }
            ];

            fields.forEach(f => {
                let div = document.createElement('div');
                div.className = "space-y-1 bg-slate-900/60 p-3.5 rounded-xl border border-spaceborder";
                div.innerHTML = `
                    <div class="text-xs uppercase font-extrabold text-slate-400 tracking-wider">${f.label}</div>
                    <div class="text-slate-200 font-medium">${f.value}</div>
                `;
                contentContainer.appendChild(div);
            });

            const modal = document.getElementById('info-modal');
            const backdrop = document.getElementById('modal-backdrop');
            const panel = document.getElementById('modal-panel');

            modal.classList.remove('hidden');
            setTimeout(() => {
                backdrop.classList.remove('opacity-0');
                panel.classList.remove('translate-x-full');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('info-modal');
            const backdrop = document.getElementById('modal-backdrop');
            const panel = document.getElementById('modal-panel');

            backdrop.classList.add('opacity-0');
            panel.classList.add('translate-x-full');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function renderSections(sectionsToRender, explicitCount = null) {
            const container = document.getElementById('levels-container');
            const emptyView = document.getElementById('empty-view');
            const badge = document.getElementById('counter-badge');

            container.innerHTML = '';

            let totalCount = explicitCount !== null ? explicitCount : sectionsToRender.reduce((acc, s) => acc + s.levels.length, 0);
            badge.textContent = `${totalCount} Levels Displayed`;

            if (sectionsToRender.length === 0 || totalCount === 0) {
                emptyView.classList.remove('hidden');
                return;
            } else {
                emptyView.classList.add('hidden');
            }

            sectionsToRender.forEach(section => {
                let count = section.levels.length;
                let tierName = section.tier;

                let divider = document.createElement('div');
                divider.className = "flex items-center my-8 text-indigo-400 font-bold tracking-widest uppercase";
                divider.innerHTML = `
                    <div class="flex-grow border-t border-indigo-500/30"></div>
                    <span class="mx-6 px-6 py-2 rounded-2xl bg-indigo-950/80 border border-indigo-500/40 shadow-md text-indigo-200 font-mono text-base md:text-lg">
                        ${count} | <strong>${tierName}</strong>
                    </span>
                    <div class="flex-grow border-t border-indigo-500/30"></div>
                `;
                container.appendChild(divider);

                section.levels.forEach(lvl => {
                    let tab = document.createElement('div');
                    let colorClass = getTierColor(tierName);
                    
                    tab.className = `border rounded-xl px-6 py-4 shadow-lg transition duration-200 grid grid-cols-1 md:grid-cols-12 items-center gap-4 ${colorClass}`;

                    let leftCol = document.createElement('div');
                    leftCol.className = "space-y-0.5 md:col-span-4";
                    leftCol.innerHTML = `
                        <div class="text-lg font-bold text-white tracking-wide">${lvl.name}</div>
                        <div class="text-xs text-slate-400">${lvl.creator}</div>
                    `;

                    let specsCol = document.createElement('div');
                    specsCol.className = "grid grid-cols-2 gap-4 md:col-span-6 text-sm text-slate-300";
                    specsCol.innerHTML = `
                        <div class="flex flex-col">
                            <span class="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Length</span>
                            <span class="font-medium text-slate-200 mt-0.5">${lvl.length}</span>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Skillsets</span>
                            <span class="font-medium text-slate-200 mt-0.5">${lvl.skillset}</span>
                        </div>
                    `;

                    let rightAction = document.createElement('div');
                    rightAction.className = "flex items-center justify-end md:col-span-2 self-end md:self-center";

                    let infoBtn = document.createElement('button');
                    infoBtn.className = "bg-slate-900 border border-spaceborder hover:border-indigo-500 text-slate-300 hover:text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shadow-md";
                    infoBtn.innerHTML = `ℹ️ Info`;
                    infoBtn.onclick = () => openModal(lvl);

                    rightAction.appendChild(infoBtn);

                    tab.appendChild(leftCol);
                    tab.appendChild(specsCol);
                    tab.appendChild(rightAction);

                    container.appendChild(tab);
                });
            });
        }
    </script>
</body>
</html>
