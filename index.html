<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Listworthy Extreme Demons</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Papa Parse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        spacebg: '#030712',
                        spacecard: '#0b0f19',
                        spaceborder: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-spacebg text-slate-100 min-h-screen font-sans selection:bg-indigo-500 selection:text-white bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(120,119,198,0.15),rgba(255,255,255,0))]">

    <div class="max-w-7xl mx-auto px-4 py-12">
        <!-- Header -->
        <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-spaceborder pb-6 gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white flex items-center gap-3">
                    <span class="text-indigo-400">🌌</span> Non-Listworthy Extreme Demons
                </h1>
                <p class="text-slate-400 mt-2 text-sm md:text-base">
                    <a href="https://docs.google.com/spreadsheets/d/1YxUE2kkvhT2E6AjnkvTf-o8iu_shSLbuFkEFcZOvieA" target="_blank" class="text-indigo-400 hover:underline font-semibold">Original Sheet ↗</a>
                </p>
            </div>
            <div id="counter-badge" class="bg-indigo-950/60 border border-indigo-500/30 text-indigo-300 font-semibold px-4 py-2 rounded-xl text-sm shadow-lg shadow-indigo-950/50">
                Loading data...
            </div>
        </header>

        <!-- Filters / Sort System -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-10 bg-spacecard/60 backdrop-blur-md border border-spaceborder p-5 rounded-2xl shadow-xl">
            <!-- 1. Tier Filter -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Filter by Tier</label>
                <select id="tier-filter" 
                    class="w-full bg-slate-900 border border-spaceborder rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-indigo-500 transition shadow-inner">
                    <option value="all">Show All</option>
                </select>
            </div>

            <!-- 2. Skillset Filter -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Filter by Skillset</label>
                <select id="skillset-filter" 
                    class="w-full bg-slate-900 border border-spaceborder rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-indigo-500 transition shadow-inner">
                    <option value="all">Show All</option>
                </select>
            </div>

            <!-- 3. Length Filter -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Filter by Length</label>
                <select id="length-filter" 
                    class="w-full bg-slate-900 border border-spaceborder rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-indigo-500 transition shadow-inner">
                    <option value="all">Show All</option>
                    <option value="medium">Medium (< 59s)</option>
                    <option value="long">Long (60s - 119s)</option>
                    <option value="xl">XL (> 120s)</option>
                </select>
            </div>
        </div>

        <!-- Loading View -->
        <div id="loading-view" class="text-center py-28">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-500 border-t-transparent mb-4"></div>
            <p class="text-slate-400 font-medium">Synchronizing sheet data...</p>
        </div>

        <!-- Empty State View -->
        <div id="empty-view" class="hidden text-center py-20 bg-spacecard/40 border border-spaceborder rounded-2xl">
            <p class="text-slate-400 text-lg">No items matching your parameters found.</p>
        </div>

        <!-- Main Display Container -->
        <div id="levels-container" class="space-y-4"></div>
    </div>

    <!-- Slide-over Modal for Level Info -->
    <div id="info-modal" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div id="modal-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity opacity-0"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div id="modal-panel" class="w-screen max-w-md bg-spacecard border-l border-spaceborder p-6 shadow-2xl transform transition-transform duration-300 ease-in-out translate-x-full flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between border-b border-spaceborder pb-4 mb-6">
                        <h3 id="modal-title" class="text-xl font-bold text-white tracking-wide">Level Information</h3>
                        <button id="close-modal" class="text-slate-400 hover:text-white p-1 rounded-lg bg-slate-900 border border-spaceborder">
                            ✕
                        </button>
                    </div>
                    <div id="modal-content" class="space-y-4 text-sm text-slate-300">
                        <!-- Dynamically injected info -->
                    </div>
                </div>
                <div class="border-t border-spaceborder pt-4 text-xs text-slate-500 text-center">
                    Non-Listworthy Extreme Demons Database
                </div>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTkS3uixPNrHp_nnr8dh2XENMuXvPF30vnVykoDDEySHWmdDpK7KZ8EPqZf-uaVA1oc1UgJr0hMKyDu/pub?output=csv';

        // Exact strict allowed tiers list
        const VALID_TIERS = [
            'Beginner', 'Easy', 'Medium', 'Hard', 'Very Hard', 'Insane', 
            'Extreme', 'Remorseless', 'Relentless', 'Terrifying', 
            'Catastrophic', 'Inexorable', 'Excruciating', 'Merciless'
        ];

        // Exact standardized skillsets
        const VALID_SKILLSETS = [
            'Ship', 'Learny', 'Memory', 'Timings', 'Wave', 'Duals', 
            'High-CPS', 'Nerve-control', 'All-around', 'Unbalanced', 'Chokepoints'
        ];

        let sheetData = [];
        let headers = [];

        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                // Filter out rows matching side menus / shortcuts / headers
                sheetData = results.data.filter(item => {
                    let firstVal = Object.values(item)[0];
                    if (!firstVal) return false;
                    let text = String(firstVal).toLowerCase();
                    if (text.includes('shortcuts') || text.includes('more levels')) return false;
                    return true;
                });

                if (sheetData.length > 0) {
                    headers = Object.keys(sheetData[0]);
                }
                initApp();
            },
            error: function(err) {
                console.error('CSV Parsing Error:', err);
                document.getElementById('loading-view').innerHTML = `
                    <p class="text-red-400 font-semibold">Failed to parse Google Sheets output. Make sure you are running via a local server or GitHub Pages.</p>
                `;
            }
        });

        function initApp() {
            document.getElementById('loading-view').classList.add('hidden');
            populateDropdowns();
            renderList(sheetData);

            document.getElementById('tier-filter').addEventListener('change', applyFilters);
            document.getElementById('skillset-filter').addEventListener('change', applyFilters);
            document.getElementById('length-filter').addEventListener('change', applyFilters);

            document.getElementById('close-modal').addEventListener('click', closeModal);
            document.getElementById('modal-backdrop').addEventListener('click', closeModal);
        }

        function populateDropdowns() {
            const tierSelect = document.getElementById('tier-filter');
            const skillsetSelect = document.getElementById('skillset-filter');

            VALID_TIERS.forEach(t => {
                let opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                tierSelect.appendChild(opt);
            });

            VALID_SKILLSETS.forEach(s => {
                let opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                skillsetSelect.appendChild(opt);
            });
        }

        function classifyLength(lengthStr) {
            if (!lengthStr) return 'unknown';
            let lower = lengthStr.toLowerCase();
            if (lower.includes('xl') || lower.includes('>')) return 'xl';
            if (lower.includes('long') || lower.includes('60') || lower.includes('119')) return 'long';
            if (lower.includes('medium') || lower.includes('<') || lower.includes('59')) return 'medium';
            return 'long';
        }

        // Helper to find the actual tier value from a row by scanning all columns for any match against VALID_TIERS
        function extractTierFromRow(item) {
            for (let val of Object.values(item)) {
                if (!val) continue;
                let strVal = String(val).trim();
                let matched = VALID_TIERS.find(t => t.toLowerCase() === strVal.toLowerCase());
                if (matched) return matched;
            }
            return null;
        }

        function applyFilters() {
            const tierVal = document.getElementById('tier-filter').value;
            const skillsetVal = document.getElementById('skillset-filter').value;
            const lengthVal = document.getElementById('length-filter').value;

            let skillsetKey = headers.find(h => /skillset|skill/i.test(h)) || headers[2];
            let lengthKey = headers.find(h => /length|time/i.test(h)) || headers[3];

            let filtered = sheetData.filter(item => {
                let rowTier = extractTierFromRow(item);
                let itemSkillsets = String(item[skillsetKey] || '');

                // Ensure the row actually contains a valid tier classification
                if (!rowTier) return false;

                let matchesTier = (tierVal === 'all') || (rowTier.toLowerCase() === tierVal.toLowerCase());
                
                let matchesSkillset = true;
                if (skillsetVal !== 'all') {
                    matchesSkillset = itemSkillsets.toLowerCase().includes(skillsetVal.toLowerCase());
                }
                
                let matchesLength = true;
                if (lengthVal !== 'all') {
                    let itemLengthType = classifyLength(item[lengthKey]);
                    matchesLength = (itemLengthType === lengthVal);
                }

                return matchesTier && matchesSkillset && matchesLength;
            });

            renderList(filtered);
        }

        function getTierColor(tierName) {
            if (!tierName) return 'border-indigo-500/40 bg-spacecard';
            let t = tierName.toLowerCase();
            if (t.includes('beginner')) return 'border-blue-500/50 bg-blue-950/10 hover:border-blue-400';
            if (t.includes('easy')) return 'border-cyan-500/50 bg-cyan-950/10 hover:border-cyan-400';
            if (t.includes('medium')) return 'border-green-500/50 bg-green-950/10 hover:border-green-400';
            if (t.includes('hard')) return 'border-yellow-500/50 bg-yellow-950/10 hover:border-yellow-400';
            if (t.includes('very hard')) return 'border-orange-500/50 bg-orange-950/10 hover:border-orange-400';
            if (t.includes('insane')) return 'border-red-500/50 bg-red-950/10 hover:border-red-400';
            if (t.includes('extreme')) return 'border-fuchsia-500/50 bg-fuchsia-950/10 hover:border-fuchsia-400';
            if (t.includes('remorseless')) return 'border-purple-500/50 bg-purple-950/10 hover:border-purple-400';
            if (t.includes('relentless')) return 'border-pink-500/50 bg-pink-950/10 hover:border-pink-400';
            if (t.includes('terrifying')) return 'border-rose-500/50 bg-rose-950/10 hover:border-rose-400';
            if (t.includes('catastrophic')) return 'border-amber-600/50 bg-amber-950/10 hover:border-amber-500';
            if (t.includes('inexorable')) return 'border-indigo-500/50 bg-indigo-950/10 hover:border-indigo-400';
            if (t.includes('excruciating')) return 'border-violet-500/50 bg-violet-950/10 hover:border-violet-400';
            if (t.includes('merciless')) return 'border-red-700/50 bg-red-950/20 hover:border-red-500';
            return 'border-spaceborder bg-spacecard';
        }

        function openModal(itemTitle, contentObj) {
            document.getElementById('modal-title').textContent = itemTitle;
            const contentContainer = document.getElementById('modal-content');
            contentContainer.innerHTML = '';

            for (const [key, val] of Object.entries(contentObj)) {
                if (!val) continue;
                let row = document.createElement('div');
                row.className = "flex flex-col bg-slate-900/60 p-3 rounded-xl border border-spaceborder";
                row.innerHTML = `<span class="text-xs uppercase font-bold text-slate-400 tracking-wider">${key}</span><span class="text-slate-200 mt-1">${val}</span>`;
                contentContainer.appendChild(row);
            }

            const modal = document.getElementById('info-modal');
            const backdrop = document.getElementById('modal-backdrop');
            const panel = document.getElementById('modal-panel');

            modal.classList.remove('hidden');
            setTimeout(() => {
                backdrop.classList.remove('opacity-0');
                panel.classList.remove('translate-x-full');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('info-modal');
            const backdrop = document.getElementById('modal-backdrop');
            const panel = document.getElementById('modal-panel');

            backdrop.classList.add('opacity-0');
            panel.classList.add('translate-x-full');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function renderList(data) {
            const container = document.getElementById('levels-container');
            const emptyView = document.getElementById('empty-view');
            const badge = document.getElementById('counter-badge');

            container.innerHTML = '';

            // Clean data to only include rows that map to a legitimate valid tier
            let validRows = data.filter(item => extractTierFromRow(item) !== null);

            badge.textContent = `${validRows.length} Levels Displayed`;

            if (validRows.length === 0) {
                emptyView.classList.remove('hidden');
                return;
            } else {
                emptyView.classList.add('hidden');
            }

            let nameKey = headers.find(h => /name|level|title/i.test(h)) || headers[0];
            let creatorKey = headers.find(h => /creator|by/i.test(h)) || headers[1];
            let lengthKey = headers.find(h => /length|time/i.test(h)) || headers[2];
            let skillsetKey = headers.find(h => /skillset|skill/i.test(h)) || headers[3];

            // Group valid rows strictly by their matched valid tier in the order of VALID_TIERS
            let tierGroups = {};
            validRows.forEach(item => {
                let t = extractTierFromRow(item);
                if (!tierGroups[t]) tierGroups[t] = [];
                tierGroups[t].push(item);
            });

            VALID_TIERS.forEach(tierName => {
                if (!tierGroups[tierName] || tierGroups[tierName].length === 0) return;

                let itemsInTier = tierGroups[tierName];
                let count = itemsInTier.length;

                // Tier section separator banner matching requested image format: < NUMBER > | < TIER >
                let divider = document.createElement('div');
                divider.className = "flex items-center my-6 text-indigo-400/80 font-bold text-sm tracking-widest uppercase";
                divider.innerHTML = `
                    <div class="flex-grow border-t border-indigo-500/20"></div>
                    <span class="mx-4 px-4 py-1.5 rounded-xl bg-indigo-950/60 border border-indigo-500/30 shadow-sm text-indigo-300 font-mono tracking-wider text-xs">
                        &lt; ${count} &gt; | &lt; ${tierName.toUpperCase()} &gt;
                    </span>
                    <div class="flex-grow border-t border-indigo-500/20"></div>
                `;
                container.appendChild(divider);

                itemsInTier.forEach(item => {
                    let tab = document.createElement('div');
                    let colorClass = getTierColor(tierName);
                    tab.className = `border rounded-xl px-5 py-4 shadow-lg transition duration-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 ${colorClass}`;

                    let levelName = item[nameKey] || 'Unknown Level';
                    let creator = item[creatorKey] || 'Unknown';
                    let length = item[lengthKey] || 'N/A';
                    let skillset = item[skillsetKey] || 'N/A';

                    let leftCol = document.createElement('div');
                    leftCol.className = "space-y-0.5";
                    leftCol.innerHTML = `
                        <div class="text-lg font-bold text-white tracking-wide">${levelName}</div>
                        <div class="text-xs text-slate-400">by ${creator}</div>
                    `;

                    let specsCol = document.createElement('div');
                    specsCol.className = "flex flex-wrap items-center gap-6 text-sm text-slate-300";
                    specsCol.innerHTML = `
                        <div><span class="text-xs uppercase font-bold text-slate-500 mr-1.5">Length</span><span class="font-medium text-slate-200">${length}</span></div>
                        <div><span class="text-xs uppercase font-bold text-slate-500 mr-1.5">Skillsets</span><span class="font-medium text-slate-200">${skillset}</span></div>
                    `;

                    let rightAction = document.createElement('div');
                    rightAction.className = "flex items-center gap-2 self-end md:self-center";

                    let infoBtn = document.createElement('button');
                    infoBtn.className = "bg-slate-900 border border-spaceborder hover:border-indigo-500 text-slate-300 hover:text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shadow-md";
                    infoBtn.innerHTML = `ℹ️ Info`;
                    infoBtn.onclick = () => openModal(levelName, item);

                    rightAction.appendChild(infoBtn);

                    tab.appendChild(leftCol);
                    tab.appendChild(specsCol);
                    tab.appendChild(rightAction);

                    container.appendChild(tab);
                });
            });
        }
    </script>
</body>
</html>
