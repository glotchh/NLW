<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glotch's Extreme Demon Completions</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Papa Parse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        spacebg: '#030712',
                        spacecard: '#0b0f19',
                        spaceborder: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-spacebg text-slate-100 min-h-screen font-sans selection:bg-indigo-500 selection:text-white bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(120,119,198,0.15),rgba(255,255,255,0))]">

    <div class="max-w-7xl mx-auto px-4 py-12">
        <!-- Header -->
        <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-spaceborder pb-6 gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white flex items-center gap-3">
                    <span class="text-indigo-400">🌌</span> Glotch's Extreme Demon Completions
                </h1>
                <p class="text-slate-400 mt-2 text-sm md:text-base">
                    All GD extreme demons completed by <a href="https://youtube.com/@glotchh" target="_blank" class="text-indigo-400 hover:underline font-semibold">Glotch ↗</a>
                </p>
            </div>
            <div id="counter-badge" class="bg-indigo-950/60 border border-indigo-500/30 text-indigo-300 font-semibold px-4 py-2 rounded-xl text-sm shadow-lg shadow-indigo-950/50">
                Loading data...
            </div>
        </header>

        <!-- Sort / Filter System (3 specific drop downs) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-10 bg-spacecard/60 backdrop-blur-md border border-spaceborder p-5 rounded-2xl shadow-xl">
            <!-- 1. Tier Filter -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Filter by Tier</label>
                <select id="tier-filter" 
                    class="w-full bg-slate-900 border border-spaceborder rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-indigo-500 transition shadow-inner">
                    <option value="all">Show All Tiers</option>
                </select>
            </div>

            <!-- 2. Skillset Filter -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Filter by Skillset</label>
                <select id="skillset-filter" 
                    class="w-full bg-slate-900 border border-spaceborder rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-indigo-500 transition shadow-inner">
                    <option value="all">Show All Skillsets</option>
                </select>
            </div>

            <!-- 3. Length Filter -->
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Filter by Length</label>
                <select id="length-filter" 
                    class="w-full bg-slate-900 border border-spaceborder rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-indigo-500 transition shadow-inner">
                    <option value="all">Show All Lengths</option>
                    <option value="medium">Medium (< 59s)</option>
                    <option value="long">Long (60s - 119s)</option>
                    <option value="xl">XL (> 120s)</option>
                </select>
            </div>
        </div>

        <!-- Loading View -->
        <div id="loading-view" class="text-center py-28">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-500 border-t-transparent mb-4"></div>
            <p class="text-slate-400 font-medium">Synchronizing space registry data...</p>
        </div>

        <!-- Empty State View -->
        <div id="empty-view" class="hidden text-center py-20 bg-spacecard/40 border border-spaceborder rounded-2xl">
            <p class="text-slate-400 text-lg">No completions matching your parameters found.</p>
        </div>

        <!-- Main Display Container (Tier Dividers + Level Tabs) -->
        <div id="levels-container" class="space-y-4"></div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTkS3uixPNrHp_nnr8dh2XENMuXvPF30vnVykoDDEySHWmdDpK7KZ8EPqZf-uaVA1oc1UgJr0hMKyDu/pub?output=csv';

        let sheetData = [];
        let headers = [];

        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                sheetData = results.data;
                if (sheetData.length > 0) {
                    headers = Object.keys(sheetData[0]);
                }
                initApp();
            },
            error: function(err) {
                console.error('CSV Parsing Error:', err);
                document.getElementById('loading-view').innerHTML = `
                    <p class="text-red-400 font-semibold">Failed to parse Google Sheets output. Make sure you are running via a local server or GitHub Pages.</p>
                `;
            }
        });

        function initApp() {
            document.getElementById('loading-view').classList.add('hidden');
            populateDropdowns();
            renderList(sheetData);

            document.getElementById('tier-filter').addEventListener('change', applyFilters);
            document.getElementById('skillset-filter').addEventListener('change', applyFilters);
            document.getElementById('length-filter').addEventListener('change', applyFilters);
        }

        function populateDropdowns() {
            const tierSelect = document.getElementById('tier-filter');
            const skillsetSelect = document.getElementById('skillset-filter');

            // Find matching header names dynamically
            let tierKey = headers.find(h => /tier|difficulty/i.test(h)) || headers[1];
            let skillsetKey = headers.find(h => /skillset|skill/i.test(h)) || headers[2];

            if (tierKey) {
                let tiers = [...new Set(sheetData.map(item => item[tierKey]))].filter(Boolean);
                tiers.forEach(t => {
                    let opt = document.createElement('option');
                    opt.value = t;
                    opt.textContent = t;
                    tierSelect.appendChild(opt);
                });
            }

            if (skillsetKey) {
                let skillsets = [...new Set(sheetData.map(item => item[skillsetKey]))].filter(Boolean);
                skillsets.forEach(s => {
                    let opt = document.createElement('option');
                    opt.value = s;
                    opt.textContent = s;
                    skillsetSelect.appendChild(opt);
                });
            }
        }

        function classifyLength(lengthStr) {
            if (!lengthStr) return 'unknown';
            let lower = lengthStr.toLowerCase();
            if (lower.includes('xl') || lower.includes('>')) return 'xl';
            if (lower.includes('long') || lower.includes('60') || lower.includes('119')) return 'long';
            if (lower.includes('medium') || lower.includes('<') || lower.includes('59')) return 'medium';
            return 'long'; // default fallback
        }

        function applyFilters() {
            const tierVal = document.getElementById('tier-filter').value;
            const skillsetVal = document.getElementById('skillset-filter').value;
            const lengthVal = document.getElementById('length-filter').value;

            let tierKey = headers.find(h => /tier|difficulty/i.test(h)) || headers[1];
            let skillsetKey = headers.find(h => /skillset|skill/i.test(h)) || headers[2];
            let lengthKey = headers.find(h => /length|time/i.test(h)) || headers[3];

            let filtered = sheetData.filter(item => {
                let matchesTier = (tierVal === 'all') || (item[tierKey] === tierVal);
                let matchesSkillset = (skillsetVal === 'all') || (item[skillsetKey] === skillsetVal);
                
                let matchesLength = true;
                if (lengthVal !== 'all') {
                    let itemLengthType = classifyLength(item[lengthKey]);
                    matchesLength = (itemLengthType === lengthVal);
                }

                return matchesTier && matchesSkillset && matchesLength;
            });

            renderList(filtered);
        }

        function getTierColor(tierName) {
            if (!tierName) return 'border-indigo-500/40 bg-spacecard';
            let t = tierName.toLowerCase();
            if (t.includes('beginner')) return 'border-blue-500/50 bg-blue-950/10 hover:border-blue-400';
            if (t.includes('intermediate') || t.includes('medium')) return 'border-emerald-500/50 bg-emerald-950/10 hover:border-emerald-400';
            if (t.includes('advanced') || t.includes('hard')) return 'border-amber-500/50 bg-amber-950/10 hover:border-amber-400';
            if (t.includes('expert') || t.includes('insane')) return 'border-purple-500/50 bg-purple-950/10 hover:border-purple-400';
            if (t.includes('extreme') || t.includes('grandmaster')) return 'border-rose-500/50 bg-rose-950/10 hover:border-rose-400';
            return 'border-spaceborder bg-spacecard';
        }

        function renderList(data) {
            const container = document.getElementById('levels-container');
            const emptyView = document.getElementById('empty-view');
            const badge = document.getElementById('counter-badge');

            badge.textContent = `${data.length} Levels Displayed`;
            container.innerHTML = '';

            if (data.length === 0) {
                emptyView.classList.remove('hidden');
                return;
            } else {
                emptyView.classList.add('hidden');
            }

            let tierKey = headers.find(h => /tier|difficulty/i.test(h)) || headers[1];
            let nameKey = headers.find(h => /name|level|title/i.test(h)) || headers[0];
            let creatorKey = headers.find(h => /creator|by/i.test(h)) || headers[1];
            let lengthKey = headers.find(h => /length|time/i.test(h)) || headers[2];
            let skillsetKey = headers.find(h => /skillset|skill/i.test(h)) || headers[3];

            let currentTier = null;

            data.forEach(item => {
                let itemTier = item[tierKey] || 'Unsorted Tier';

                // Insert tier separator divider when transitioning to a new tier section
                if (itemTier !== currentTier) {
                    currentTier = itemTier;
                    let divider = document.createElement('div');
                    divider.className = "flex items-center my-6 text-indigo-400/80 font-bold text-sm tracking-widest uppercase";
                    divider.innerHTML = `
                        <div class="flex-grow border-t border-indigo-500/20"></div>
                        <span class="mx-4 px-3 py-1 rounded-full bg-indigo-950/50 border border-indigo-500/30 shadow-sm">----------- ${currentTier} -----------</span>
                        <div class="flex-grow border-t border-indigo-500/20"></div>
                    `;
                    container.appendChild(divider);
                }

                // Render individual level tab
                let tab = document.createElement('div');
                let colorClass = getTierColor(itemTier);
                tab.className = `border rounded-xl p-4 shadow-lg transition duration-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 ${colorClass}`;

                let levelName = item[nameKey] || 'Unknown Level';
                let creator = item[creatorKey] || 'Unknown';
                let length = item[lengthKey] || 'N/A';
                let skillset = item[skillsetKey] || 'N/A';

                // Find any remaining info fields or proofs/links
                let extraInfoHTML = '';
                headers.forEach(h => {
                    if ([nameKey, creatorKey, lengthKey, skillsetKey, tierKey].includes(h)) return;
                    let val = item[h];
                    if (!val) return;
                    if (String(val).startsWith('http')) {
                        extraInfoHTML += `<a href="${val}" target="_blank" class="text-xs font-semibold bg-indigo-600/20 text-indigo-400 hover:bg-indigo-600 hover:text-white px-2.5 py-1 rounded-md transition ml-2">Proof ↗</a>`;
                    } else {
                        extraInfoHTML += `<span class="ml-2 text-slate-400">• ${h}: <span class="text-slate-300">${val}</span></span>`;
                    }
                });

                tab.innerHTML = `
                    <div class="space-y-1">
                        <div class="text-base md:text-lg font-bold text-white tracking-wide">${levelName}</div>
                        <div class="text-xs md:text-sm text-slate-400 font-normal flex flex-wrap items-center gap-x-3 gap-y-1">
                            <span><strong class="text-slate-300 font-medium">Creator(s):</strong> ${creator}</span>
                            <span><strong class="text-slate-300 font-medium">Length:</strong> ${length}</span>
                            <span><strong class="text-slate-300 font-medium">Skillsets:</strong> ${skillset}</span>
                        </div>
                    </div>
                    <div class="flex items-center text-xs text-slate-400 self-end sm:self-center">
                        ${extraInfoHTML}
                    </div>
                `;

                container.appendChild(tab);
            });
        }
    </script>
</body>
</html>
